<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Measured CPU to GPU median time ratio</title>
<desc id="desc">Five matched benchmark cases: 50 trials, 3.15 times, 100 trials, 5.75 times, 200 trials, 10.56 times, 400 trials, 17.49 times, 800 trials, 35.01 times.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="115" y="35" font-family="Arial,sans-serif" font-size="21" fill="#1b365d">Measured CPU / GPU median time</text>
<text x="115" y="57" font-family="Arial,sans-serif" font-size="12" fill="#52667b">Same 1,000-sample synthetic signal and explicit noise W</text>
<line x1="115.0" y1="82" x2="115.0" y2="337" stroke="#e3e9ee"/>
<text x="115.0" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52667b">0×</text>
<line x1="270.0" y1="82" x2="270.0" y2="337" stroke="#e3e9ee"/>
<text x="270.0" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52667b">10×</text>
<line x1="425.0" y1="82" x2="425.0" y2="337" stroke="#e3e9ee"/>
<text x="425.0" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52667b">20×</text>
<line x1="580.0" y1="82" x2="580.0" y2="337" stroke="#e3e9ee"/>
<text x="580.0" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52667b">30×</text>
<line x1="735.0" y1="82" x2="735.0" y2="337" stroke="#e3e9ee"/>
<text x="735.0" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52667b">40×</text>
<text x="20" y="121" font-family="Arial,sans-serif" font-size="14" fill="#34495e">50 trials</text>
<rect x="115" y="101" width="48.9" height="28" rx="4" fill="#007c78"/>
<text x="175.9" y="121" font-family="Arial,sans-serif" font-size="14" fill="#1b365d">3.15×</text>
<text x="20" y="169" font-family="Arial,sans-serif" font-size="14" fill="#34495e">100 trials</text>
<rect x="115" y="149" width="89.1" height="28" rx="4" fill="#007c78"/>
<text x="216.1" y="169" font-family="Arial,sans-serif" font-size="14" fill="#1b365d">5.75×</text>
<text x="20" y="217" font-family="Arial,sans-serif" font-size="14" fill="#34495e">200 trials</text>
<rect x="115" y="197" width="163.7" height="28" rx="4" fill="#007c78"/>
<text x="290.7" y="217" font-family="Arial,sans-serif" font-size="14" fill="#1b365d">10.56×</text>
<text x="20" y="265" font-family="Arial,sans-serif" font-size="14" fill="#34495e">400 trials</text>
<rect x="115" y="245" width="271.1" height="28" rx="4" fill="#007c78"/>
<text x="398.1" y="265" font-family="Arial,sans-serif" font-size="14" fill="#1b365d">17.49×</text>
<text x="20" y="313" font-family="Arial,sans-serif" font-size="14" fill="#34495e">800 trials</text>
<rect x="115" y="293" width="542.6" height="28" rx="4" fill="#007c78"/>
<text x="669.6" y="313" font-family="Arial,sans-serif" font-size="14" fill="#1b365d">35.01×</text>
<text x="450" y="380" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#52667b">Serial CPU median / batch GPU median · higher means faster GPU</text>
</svg>
