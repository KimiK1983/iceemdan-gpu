[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iceemdan-gpu"
version = "0.2.0"
description = "ICEEMDAN decomposition on CUDA with a batched CuPy EMD"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy>=2,<3", "cupy-cuda12x==14.2.0"]

[tool.setuptools.packages.find]
include = ["iceemdan_cupy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]

[dependency-groups]
dev = ["mypy==2.3.1", "pytest>=9,<10", "ruff==0.16.9", "scipy==1.17.0"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF100"]
unfixable = ["F401", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"tools/**/*.py" = ["E402"]
"examples/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["iceemdan_cupy"]
check_untyped_defs = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["cupy", "cupyx", "cupyx.*"]
ignore_missing_imports = true
